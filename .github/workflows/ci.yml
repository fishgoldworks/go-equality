name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '8.0.0'
      - name: Preserve the minimum consumer runtime
        run: echo "GO_EQUALITY_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run docs
      - name: Check generated documentation
        run: git diff --exit-code -- README.md docs/API.md
      - name: Build the consumer package and verify one release candidate
        run: npm run verify -- --destination "${{ runner.temp }}/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
  verify-node24:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '8.0.0'
      - name: Preserve the minimum consumer runtime
        run: echo "GO_EQUALITY_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs
      - name: Check generated documentation
        run: git diff --exit-code -- README.md docs/API.md
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Check transferred candidate digest
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check *.sha256
      - name: Confirm the consumer job has no generated package
        run: test ! -e package
      - name: Run the full Node 24 gate on the existing candidate
        run: npm run verify -- --tarball "${{ runner.temp }}/candidate/go-equality-$(node -p 'require("./package.json").version').tgz"
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['8.0.0', '13.0.0', '12.20.0', '14.13.0', '16.0.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Preserve the selected consumer runtime
        run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Check transferred candidate digest
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check *.sha256
      - name: Check the exact candidate on the selected and modern runtimes
        run: npm run test:package -- --tarball "${{ runner.temp }}/candidate/go-equality-$(node -p 'require("./package.json").version').tgz" --node "$CONSUMER_NODE"
  typescript:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript: ['3.0.3', '5.8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Check transferred candidate digest
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check *.sha256
      - name: Install the exact candidate and selected compiler outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund --package-lock=false "$RUNNER_TEMP"/candidate/*.tgz
          npm install --prefix "$RUNNER_TEMP/compiler" --ignore-scripts --no-save --package-lock=false typescript@${{ matrix.typescript }}
      - name: Check the installed package with shared contracts
        run: node scripts/test-types-compat.js --compiler "${{ runner.temp }}/compiler/node_modules/typescript/lib/tsc.js" --package "${{ runner.temp }}/consumer/node_modules/go-equality"
  browser:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ['chromium', 'firefox', 'webkit']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/browser/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Check transferred candidate digest
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check *.sha256
      - run: python -m pip install -r test/browser/requirements.txt
      - name: Use Ubuntu primary mirrors for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check browser bundles from the exact candidate
        run: npm run test:browser -- --tarball "${{ runner.temp }}/candidate/go-equality-$(node -p 'require("./package.json").version').tgz" --browser ${{ matrix.browser }} --output browser-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: browser-results.json
          if-no-files-found: warn
